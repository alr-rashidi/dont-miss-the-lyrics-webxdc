name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version and filename
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            XDC_NAME="dont-miss-the-lyrics-${VERSION}.xdc"
          else
            VERSION="dev"
            XDC_NAME="dont-miss-the-lyrics-dev.xdc"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "XDC_NAME=${XDC_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"
          echo "Using filename: ${XDC_NAME}"

      - name: Update manifest.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Updating version to ${VERSION}"
          # Replace existing version line or append if missing
          if grep -q '^version[[:space:]]*=' manifest.toml; then
            sed -i "s/^version[[:space:]]*=.*/version = \"${VERSION}\"/" manifest.toml
          else
            echo "version = \"${VERSION}\"" >> manifest.toml
          fi
          echo "=== manifest.toml ==="
          cat manifest.toml

      - name: Build project (pnpm build → dist/)
        run: pnpm build

      - name: Build minified .xdc from dist/
        run: |
          XDC_NAME="${{ steps.version.outputs.XDC_NAME }}"
          chmod +x ./git-assets/make-xdc.sh
          # --from-dist packages the already-built dist/ tree
          # --minify still runs a final pass (useful if the Vite build left
          # readable source maps or comments; safe no-op on already-minified files)
          ./git-assets/make-xdc.sh "${XDC_NAME}" --from-dist --minify --verbose
          echo "=== Contents of ${XDC_NAME} ==="
          unzip -l "${XDC_NAME}"
          test -s "${XDC_NAME}"
          # Sanity-check that index.html is present at the root of the archive
          unzip -l "${XDC_NAME}" | grep -q 'index.html'

      - name: Upload .xdc as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.XDC_NAME }}
          path: ${{ steps.version.outputs.XDC_NAME }}
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.XDC_NAME }}
          generate_release_notes: true
